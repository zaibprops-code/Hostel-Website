<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;
  background:radial-gradient(125% 100% at 50% 20%, #1c5148 0%, #123a30 46%, #0b201b 100%);
  font-family:'Fraunces',Georgia,serif;color:#faf7f0}
.grain{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,.05) 1px,transparent 1px);background-size:6px 6px;opacity:.55}
.arcade{position:absolute;left:-40px;right:-40px;top:-40px;opacity:.12;z-index:1;transform:rotate(180deg)}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:120px 96px;z-index:3}
.eyebrow{font-family:'Inter',sans-serif;font-size:25px;font-weight:600;letter-spacing:.34em;color:#d7ba70;text-transform:uppercase}
.mark{width:104px;height:104px;margin-bottom:26px}
.head{font-size:90px;line-height:1.05;font-weight:500;letter-spacing:-.01em;max-width:820px;margin-top:8px}
.subline{margin-top:40px;font-family:'Inter',sans-serif;font-size:34px;line-height:1.5;font-weight:400;color:rgba(250,247,240,.74);letter-spacing:.01em;max-width:700px}
.rule{width:70px;height:2px;background:#c9a24b;margin:56px 0}
.cta{display:flex;flex-direction:column;gap:22px;align-items:center}
.btn{font-family:'Inter',sans-serif;font-size:36px;font-weight:600;letter-spacing:.02em;color:#0e2721;background:#d7ba70;border-radius:999px;padding:28px 64px;display:inline-flex;align-items:center;gap:16px}
.foot{position:absolute;left:0;right:0;bottom:92px;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:3}
.web{font-family:'Inter',sans-serif;font-size:29px;font-weight:500;color:rgba(250,247,240,.82);letter-spacing:.05em}
.handle{font-family:'Inter',sans-serif;font-size:27px;font-weight:600;letter-spacing:.08em;color:#d7ba70}
</style></head>
<body>
<div class="slide">
  <div class="grain"></div>
  <svg class="arcade" viewBox="0 0 1160 380" fill="none">
    <g stroke="#d7ba70" stroke-width="3" fill="none">
      <path d="M120 360 V200 a80 80 0 0 1 160 0 V360"/>
      <path d="M330 360 V200 a80 80 0 0 1 160 0 V360"/>
      <path d="M540 360 V200 a80 80 0 0 1 160 0 V360"/>
      <path d="M750 360 V200 a80 80 0 0 1 160 0 V360"/>
      <path d="M960 360 V200 a80 80 0 0 1 160 0 V360"/>
      <line x1="70" y1="360" x2="1120" y2="360"/>
    </g>
  </svg>
  <div class="inner">
    <svg class="mark" viewBox="0 0 40 40" fill="none">
      <g stroke="#d7ba70" stroke-width="1.7" stroke-linecap="round" fill="none">
        <path d="M9 31 V18.5 a11 11 0 0 1 22 0 V31"/>
        <path d="M14.5 31 v-9.5 a5.5 5.5 0 0 1 11 0 V31"/>
        <line x1="6.5" y1="31.4" x2="33.5" y2="31.4"/>
      </g>
    </svg>
    <div class="eyebrow">Booking now</div>
    <div class="head">Your room in<br/>Islamabad is ready.</div>
    <div class="subline">Reserve a bed or arrange a visit —<br/>we usually reply within the hour.</div>
    <hr class="rule"/>
    <div class="cta">
      <span class="btn">◆&nbsp; Book on WhatsApp</span>
    </div>
  </div>
  <div class="foot">
    <span class="web">riwaqhostels.com</span>
    <span class="handle">@riwaqhostels</span>
  </div>
</div>
</body></html>
