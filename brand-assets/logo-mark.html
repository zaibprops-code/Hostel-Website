<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .canvas{width:1024px;height:1024px;position:relative;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 35%, #1c5148 0%, #123a30 45%, #0b201b 100%);
    display:flex;align-items:center;justify-content:center}
  .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,0.05) 1px,transparent 1px);background-size:6px 6px;opacity:.5}
  .ring{position:absolute;inset:78px;border:3px solid rgba(215,186,112,0.30);border-radius:80px}
  .mark{width:520px;height:520px;position:relative;z-index:2}
</style></head>
<body>
  <div class="canvas">
    <div class="grain"></div>
    <div class="ring"></div>
    <svg class="mark" viewBox="0 0 40 40" fill="none">
      <g stroke="#d7ba70" stroke-width="1.7" stroke-linecap="round" fill="none">
        <path d="M9 31 V18.5 a11 11 0 0 1 22 0 V31"/>
        <path d="M14.5 31 v-9.5 a5.5 5.5 0 0 1 11 0 V31"/>
        <line x1="6.5" y1="31.4" x2="33.5" y2="31.4"/>
      </g>
    </svg>
  </div>
</body></html>
