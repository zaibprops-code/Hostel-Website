<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0}
  .canvas{width:1024px;height:1024px;position:relative;overflow:hidden;
    background:radial-gradient(120% 120% at 50% 32%, #1c5148 0%, #123a30 45%, #0b201b 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif}
  .grain{position:absolute;inset:0;background-image:radial-gradient(rgba(0,0,0,0.05) 1px,transparent 1px);background-size:6px 6px;opacity:.5}
  .mark{width:392px;height:392px;position:relative;z-index:2}
  .word{position:relative;z-index:2;margin-top:44px;font-size:224px;line-height:1;font-weight:600;color:#faf7f0;letter-spacing:-.02em}
  .word .dot{color:#d7ba70}
  .sub{position:relative;z-index:2;margin-top:28px;font-family:'Inter',system-ui,sans-serif;font-size:50px;font-weight:600;letter-spacing:.42em;color:#d7ba70;padding-left:.42em}
</style></head>
<body>
  <div class="canvas">
    <div class="grain"></div>
    <svg class="mark" viewBox="0 0 40 40" fill="none">
      <g stroke="#d7ba70" stroke-width="1.7" stroke-linecap="round" fill="none">
        <path d="M9 31 V18.5 a11 11 0 0 1 22 0 V31"/>
        <path d="M14.5 31 v-9.5 a5.5 5.5 0 0 1 11 0 V31"/>
        <line x1="6.5" y1="31.4" x2="33.5" y2="31.4"/>
      </g>
    </svg>
    <div class="word">Riwaq<span class="dot">.</span></div>
    <div class="sub">HOSTELS</div>
  </div>
</body></html>
